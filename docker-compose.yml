version: "3.8"

services:
  cookie-agent-capp:
    build: .
    container_name: cookie-agent-capp
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - COOKIE_RPC_URL=https://rpc.cookiescan.io
      - COOKIE_DAS_API=https://api.cookiescan.io
      - PORT=8080
      - HOST=0.0.0.0
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
